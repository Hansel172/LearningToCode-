<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macro Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div>
      <h1>Macro Tracker</h1>
      <div class="date" id="today"></div>
    </div>
    <div class="snapshot" id="snapshot"></div>
  </header>

  <div class="strip" id="strip"></div>
  <div id="errors"></div>

  <div class="grid" id="grid"></div>
  <div id="pending"></div>
  <div id="catalysts"></div>

  <footer>
    <span id="stamp"></span><br>
    All figures from FRED (fredgraph, no API key). Index levels are last close, not intraday.<br>
    Personal research tool. Not investment advice.
  </footer>

</div>

<!-- Generated by scripts/refresh.py. A script tag rather than fetch() so the
     page works when opened directly from disk — browsers block fetch on file://. -->
<script src="data/bundle.js"></script>
<script src="app.js"></script>
</body>
</html>
