name: Macro Tracker Refresh

on:
  schedule:
    # Checks 3x/day instead of once — a single 7:12am ET check kept showing
    # stale data for whichever FRED series hadn't posted its update yet by
    # that specific moment (confirmed live: DGS10's Monday value existed on
    # FRED by midday but the single morning check had already run and
    # missed it, so it sat showing Friday's value until the *next* day's
    # check — which then had the same problem with whatever posted late
    # that day, a rolling lag that never closes on its own). FRED series
    # post at different times of day (equity closes, Treasury H.15 data,
    # Fed funds effective rate), so multiple passes through the day is what
    # actually catches each one same-day rather than one shot at a single
    # fixed hour. Off the hour deliberately, same reasoning as the earnings
    # tracker: GitHub delays scheduled jobs most heavily right at :00.
    - cron: '12 11,17,22 * * 1-5'   # ~7:12am, 1:12pm, 6:12pm ET, weekdays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install httpx python-dotenv

      # themes.json is gitignored (it holds portfolio detail), so the runner
      # won't have it. Carry forward whatever is already published rather than
      # wiping the analysis every time the numbers refresh.
      - name: Restore analysis from the published copy
        run: |
          mkdir -p macro-tracker/data
          if [ -f docs/macro/data.json ]; then
            python3 -c "import json,pathlib; d=json.load(open('docs/macro/data.json')); pathlib.Path('macro-tracker/data/themes.json').write_text(json.dumps(d.get('themes',{}),indent=2))"
            echo "carried forward existing analysis"
          fi

      # build_public.py rebuilds data.json from scratch every run (live +
      # themes only) — it has no concept of pending_deals, so that key would
      # silently vanish before scan_news.py ever saw it without this.
      - name: Snapshot previous data
        run: cp docs/macro/data.json /tmp/old_macro_data.json

      - name: Refresh numbers
        run: python3 macro-tracker/scripts/refresh.py

      - name: Build public copy
        run: python3 macro-tracker/scripts/build_public.py

      # Detects, never auto-writes, M&A/partnership headlines for held
      # tickers — see scripts/scan_news.py for why this stops short of full
      # automation. Same HOLDING_TICKERS secret the earnings tracker uses
      # (same real-world holdings, no reason for a second list of them).
      - name: Scan for deal news
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          HOLDING_TICKERS: ${{ secrets.HOLDING_TICKERS }}
        run: python3 macro-tracker/scripts/scan_news.py /tmp/old_macro_data.json

      # Retries on a rejected push instead of failing outright — same fix
      # already applied to the earnings tracker for the same reason: 3x/day
      # instead of once means two runs (or a manual trigger overlapping the
      # schedule) can now plausibly overlap. Resets to whatever the other
      # run already pushed rather than rebasing: docs/macro/data.json is
      # entirely regenerated from FRED/NewsAPI every run, so there's never
      # anything here worth preserving through a merge.
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain docs/macro)" ]; then
            echo "no change"
            exit 0
          fi
          git add docs/macro
          git commit -m "Macro refresh $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — another run already landed; adopting it"
            git fetch origin main
            git reset --hard origin/main
            sleep $((attempt * 3))
          done
          echo "still rejected after 3 attempts — leaving main as the other run(s) left it" >&2
          exit 0
