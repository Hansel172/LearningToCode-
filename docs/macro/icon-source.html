<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  svg { display: block; }
</style>
<body>
<!--
  App icon design: a single centered dot, in the app's own --red token
  (#ff5252) rather than an arbitrary red, so the icon draws from the same
  palette the app itself uses (status colors, badges) instead of
  introducing a one-off color nobody else in the app uses.
  Full-bleed dark background matches the app's own --bg (#0a0a0f) and the
  manifest's theme_color, so the icon visually continues into the app
  when it launches. No text, no curves to get wrong — just one shape.
-->
<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#0a0a0f"/>
  <circle cx="256" cy="256" r="90" fill="#ff5252"/>
</svg>
</body>
